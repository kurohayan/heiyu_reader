  xml: ^6.5.0
  archive: ^3.6.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  flutter_tts: ^4.2.0
  battery_plus: ^6.0.3
  file_picker: ^8.1.5
  receive_sharing_intent: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
