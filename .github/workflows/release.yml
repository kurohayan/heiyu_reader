name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing secret: ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "Missing secret: ANDROID_STORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing secret: ANDROID_KEY_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing secret: ANDROID_KEY_ALIAS" && exit 1)

      - name: Restore Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties << EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Validate Android signing
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          keystore="android/app/upload-keystore.jks"
          test -s "$keystore" || {
            echo "::error::Android keystore is missing or empty after restore."
            exit 1
          }

          if ! keytool -list \
            -keystore "$keystore" \
            -storepass:env ANDROID_STORE_PASSWORD \
            >/dev/null 2>"$RUNNER_TEMP/android-keystore-check.err"; then
            echo "::error::Android keystore validation failed: check ANDROID_STORE_PASSWORD (the keystore password) or the keystore file."
            exit 1
          fi

          if ! keytool -list \
            -keystore "$keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD \
            >/dev/null 2>"$RUNNER_TEMP/android-alias-check.err"; then
            echo "::error::Android signing validation failed: check ANDROID_KEY_ALIAS. The keystore password passed."
            exit 1
          fi

          # keytool -list accepts all three credentials, while certreq also
          # opens the private key and therefore catches a mismatched keypass.
          if ! keytool -list \
            -keystore "$keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            >/dev/null 2>"$RUNNER_TEMP/android-key-check.err"; then
            echo "::error::Android private-key validation failed: check ANDROID_KEY_PASSWORD. The keystore password and alias passed."
            exit 1
          fi

          validation_csr="$RUNNER_TEMP/android-signing-validation.csr"
          trap 'rm -f "$validation_csr"' EXIT
          if ! keytool -certreq \
            -keystore "$keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -file "$validation_csr" \
            >/dev/null 2>"$RUNNER_TEMP/android-keypass-check.err"; then
            echo "::error::Android private-key validation failed: ANDROID_KEY_PASSWORD does not unlock the key for this alias. The keystore password passed."
            exit 1
          fi

          echo "Android keystore, alias, and signing passwords validated without printing secret values."

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Rename packages
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "heiyu-reader-${GITHUB_REF_NAME}-android.apk"

          cp build/app/outputs/bundle/release/app-release.aab \
             "heiyu-reader-${GITHUB_REF_NAME}-android.aab"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "heiyu-reader-${GITHUB_REF_NAME}-android.apk" \
              "heiyu-reader-${GITHUB_REF_NAME}-android.aab" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "heiyu-reader-${GITHUB_REF_NAME}-android.apk" \
              "heiyu-reader-${GITHUB_REF_NAME}-android.aab" \
              --title "黑羽阅读 ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
