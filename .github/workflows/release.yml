name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing secret: ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "Missing secret: ANDROID_STORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing secret: ANDROID_KEY_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing secret: ANDROID_KEY_ALIAS" && exit 1)

      - name: Restore Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties << EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Validate Android signing
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          keystore="android/app/upload-keystore.jks"
          test -s "$keystore" || {
            echo "::error::Android keystore is missing or empty after restore."
            exit 1
          }

          if ! keytool -list \
            -keystore "$keystore" \
            -storepass:env ANDROID_STORE_PASSWORD \
            >/dev/null 2>"$RUNNER_TEMP/android-keystore-check.err"; then
            echo "::error::Android keystore validation failed: check ANDROID_STORE_PASSWORD (the keystore password) or the keystore file."
            exit 1
          fi

          if ! keytool -list \
            -keystore "$keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD \
            >/dev/null 2>"$RUNNER_TEMP/android-alias-check.err"; then
            echo "::error::Android signing validation failed: check ANDROID_KEY_ALIAS. The keystore password passed."
            exit 1
          fi

          # Keep the requested keytool -list check, then use Java KeyStore
          # below because list alone does not unwrap a PKCS12 private key.
          if ! keytool -list \
            -keystore "$keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            >/dev/null 2>"$RUNNER_TEMP/android-key-check.err"; then
            echo "::error::Android private-key validation failed: check ANDROID_KEY_PASSWORD. The keystore password and alias passed."
            exit 1
          fi

          validator="$RUNNER_TEMP/ValidateAndroidSigning.java"
          cat > "$validator" <<'JAVA'
          import java.io.InputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.PrivateKey;

          public final class ValidateAndroidSigning {
            private static final int STORE_PASSWORD_ERROR = 2;
            private static final int ALIAS_ERROR = 3;
            private static final int KEY_PASSWORD_ERROR = 4;

            public static void main(String[] args) throws Exception {
              if (args.length != 1) {
                System.exit(1);
              }

              final String alias = requiredEnv("ANDROID_KEY_ALIAS");
              final char[] storePassword =
                  requiredEnv("ANDROID_STORE_PASSWORD").toCharArray();
              final char[] keyPassword =
                  requiredEnv("ANDROID_KEY_PASSWORD").toCharArray();
              final Path keystorePath = Path.of(args[0]);
              KeyStore keystore = null;

              // The file is named .jks in the Android project, but Java 17
              // commonly creates PKCS12 keystores by default. Try both
              // formats without printing provider or password errors.
              for (String type : new String[] {"PKCS12", "JKS"}) {
                try (InputStream input = Files.newInputStream(keystorePath)) {
                  final KeyStore candidate = KeyStore.getInstance(type);
                  candidate.load(input, storePassword);
                  keystore = candidate;
                  break;
                } catch (Exception ignored) {
                  // Try the other standard keystore format.
                }
              }
              if (keystore == null) {
                System.exit(STORE_PASSWORD_ERROR);
              }
              if (!keystore.containsAlias(alias)) {
                System.exit(ALIAS_ERROR);
              }

              try {
                final Key key = keystore.getKey(alias, keyPassword);
                if (!(key instanceof PrivateKey)) {
                  System.exit(KEY_PASSWORD_ERROR);
                }
              } catch (Exception ignored) {
                // This is the check that keytool -list cannot reliably make
                // for PKCS12: actually unwrap the private key.
                System.exit(KEY_PASSWORD_ERROR);
              }
            }

            private static String requiredEnv(String name) {
              final String value = System.getenv(name);
              if (value == null) {
                System.exit(1);
              }
              return value;
            }
          }
          JAVA

          if ! javac -d "$RUNNER_TEMP" "$validator" \
            >/dev/null 2>"$RUNNER_TEMP/android-java-check.err"; then
            echo "::error::Java Android signing validation could not run. Check the Java setup and keystore format."
            exit 1
          fi

          set +e
          java -cp "$RUNNER_TEMP" ValidateAndroidSigning "$keystore" \
            >/dev/null 2>"$RUNNER_TEMP/android-keystore-getkey.err"
          java_status=$?
          set -e
          case "$java_status" in
            0)
              ;;
            2)
              echo "::error::Android keystore validation failed: KeyStore could not open the keystore with ANDROID_STORE_PASSWORD."
              exit 1
              ;;
            3)
              echo "::error::Android signing validation failed: ANDROID_KEY_ALIAS was not found in the keystore."
              exit 1
              ;;
            4)
              echo "::error::Android private-key validation failed: ANDROID_KEY_PASSWORD does not unlock the key for this alias. For a PKCS12 keystore, it usually must equal ANDROID_STORE_PASSWORD."
              exit 1
              ;;
            *)
              echo "::error::Android signing validation failed while opening the private key. Check the signing Secret configuration."
              exit 1
              ;;
          esac

          echo "Android keystore, alias, and signing passwords validated without printing secret values."

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Rename packages
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "heiyu-reader-${GITHUB_REF_NAME}-android.apk"

          cp build/app/outputs/bundle/release/app-release.aab \
             "heiyu-reader-${GITHUB_REF_NAME}-android.aab"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "heiyu-reader-${GITHUB_REF_NAME}-android.apk" \
              "heiyu-reader-${GITHUB_REF_NAME}-android.aab" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "heiyu-reader-${GITHUB_REF_NAME}-android.apk" \
              "heiyu-reader-${GITHUB_REF_NAME}-android.aab" \
              --title "黑羽阅读 ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
